<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>StudyDesk — page not found</title>
    <script>
      var target = '/StudyDesk/';
      if (location.pathname !== target) {
        var route = location.pathname.startsWith(target)
          ? location.pathname.slice(target.length)
          : '';
        location.replace(
          target +
            '?studydesk-path=' +
            encodeURIComponent('/' + route + location.search + location.hash),
        );
      }
    </script>
  </head>
  <body></body>
</html>
