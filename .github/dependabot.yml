version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule: { interval: weekly }
    groups:
      dev-tooling:
        patterns:
          [
            'eslint*',
            'prettier*',
            'typescript',
            'vitest',
            '@types/*',
            'tailwindcss',
            '@tailwindcss/*',
          ]
  - package-ecosystem: github-actions
    directory: '/'
    schedule: { interval: weekly }
